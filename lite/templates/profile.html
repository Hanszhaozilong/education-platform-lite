{% extends 'base.html' %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">个人中心</span><h1>{{ g.user.name }}</h1><p class="subtle">{{ roles[g.user.role] }} · {{ g.user.username }}</p></div></div>
<section class="card form-card"><h2>修改登录密码</h2><form method="post">{{ csrf() }}<label>原密码<input type="password" name="old_password" required autocomplete="current-password"></label><label>新密码（至少 12 位）<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><div class="form-actions"><button class="button" type="submit">保存并重新登录</button></div></form></section>
{% endblock %}
