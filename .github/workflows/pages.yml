name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/demo/**', 'tests/test_demo.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check demo JavaScript and behavior
        run: |
          node --check docs/demo/assets/app.mjs
          node --test tests/test_demo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/demo
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
